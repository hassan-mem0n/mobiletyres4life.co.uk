<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#E5C365" />
      <stop offset="70%" stop-color="#C9A038" />
      <stop offset="100%" stop-color="#8C6718" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E10" />
      <stop offset="100%" stop-color="#0E0C07" />
    </linearGradient>
  </defs>

  <!-- ICON BADGE (TYRE & RIM) -->
  <g transform="translate(8, 5)">
    <!-- Outer Tyre Tread Ring -->
    <circle cx="40" cy="40" r="38" fill="url(#goldDark)" stroke="url(#goldGrad)" stroke-width="3.5" />
    <circle cx="40" cy="40" r="32" stroke="#403417" stroke-width="1.5" stroke-dasharray="3 3" />
    
    <!-- Inner Rim -->
    <circle cx="40" cy="40" r="23" fill="#121212" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- 8 Rim Spokes -->
    <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
      <line x1="40" y1="18" x2="40" y2="28" />
      <line x1="40" y1="52" x2="40" y2="62" />
      <line x1="18" y1="40" x2="28" y2="40" />
      <line x1="52" y1="40" x2="62" y2="40" />
      <line x1="24.5" y1="24.5" x2="31.5" y2="31.5" />
      <line x1="48.5" y1="48.5" x2="55.5" y2="55.5" />
      <line x1="24.5" y1="55.5" x2="31.5" y2="48.5" />
      <line x1="48.5" y1="31.5" x2="55.5" y2="24.5" />
    </g>

    <!-- Center Hub -->
    <circle cx="40" cy="40" r="8.5" fill="url(#goldGrad)" />
    <circle cx="40" cy="40" r="4.5" fill="#0A0A0A" />

    <!-- Speed / Wrench Accent -->
    <path d="M 68 20 C 73 26, 75 35, 74 44" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 72 26 C 76 32, 77 40, 76 48" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- TEXT TYPOGRAPHY -->
  <g transform="translate(100, 0)">
    <!-- Brand Name: FIX MY TYRE -->
    <text x="0" y="45" font-family="'Oswald', 'Arial Black', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      FIX MY <tspan fill="url(#goldGrad)" font-weight="800">TYRE</tspan>
    </text>

    <!-- Tagline Banner -->
    <rect x="0" y="55" width="268" height="21" rx="4" fill="rgba(212, 175, 55, 0.12)" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1" />
    
    <!-- Pulse dot -->
    <circle cx="10" cy="65.5" r="3.5" fill="#E5C365" />
    
    <!-- Subtitle -->
    <text x="22" y="69.5" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#E5C365" letter-spacing="2.8">
      24/7 MOBILE TYRE FITTING
    </text>
  </g>
</svg>
